image: nixos/nix:latest

variables:
  QUARTZ_BASE_URL: m4rc2a.github.io/eis-wiki/

pages:
  before_script:
    - nix profile install nixpkgs#git --profile /nix/var/nix/profiles/default
    - git submodule update --init --recursive
  script:
    - nix build
    - cp -r result/public public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
